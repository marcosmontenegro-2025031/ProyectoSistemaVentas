<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Venta | Sistema Ventas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/crud.css}">
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-store"></i> Sistema Ventas
        </div>
        <nav>
            <ul>
                <li><a th:href="@{/home}"><i class="fas fa-house"></i> Inicio</a></li>
                <li><a th:href="@{/ventas}"><i class="fas fa-cart-shopping"></i> Ventas</a></li>
                <li><a th:href="@{/productos}"><i class="fas fa-boxes-stacked"></i> Productos</a></li>
                <li><a th:href="@{/clientes}"><i class="fas fa-address-book"></i> Clientes</a></li>
                <li><a th:href="@{/usuarios}"><i class="fas fa-user-gear"></i> Usuarios</a></li>
                <li><a class="active" th:href="@{/detalle-venta}"><i class="fas fa-circle-info"></i> Detalle Venta</a></li>
                <li class="logout-item">
                    <a th:href="@{/login}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
                </li>
            </ul>
        </nav>
    </aside>

    <div class="main-wrapper">
        
        <header class="navbar">
            <div class="nav-left">
                <h2>Gestión de Detalles de Venta</h2>
            </div>
            <div class="nav-right">
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn-logout-nav">
                        <i class="fas fa-sign-out-alt"></i> Cerrar sesión
                    </button>
                </form>
            </div>
        </header>

        <main class="main-content" style="padding: 30px;">
            
            <div class="table-actions" style="margin-bottom: 25px;">
                <a class="btn-main" th:href="@{/detalle-venta/nuevo}">
                    <i class="fas fa-plus"></i> Nuevo Detalle de Venta
                </a>
            </div>

            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Cantidad</th>
                            <th>Precio Unitario</th>
                            <th>SubTotal</th>
                            <th>Producto</th>
                            <th>ID Venta</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="detalle : ${detalles}">
                            <td th:text="${detalle.id}">1</td>
                            <td th:text="${detalle.cantidad}">2</td>
                            <td th:text="${'Q ' + detalle.precioUnitario}">Q 4500.00</td>
                            <td th:text="${'Q ' + detalle.subTotal}" style="font-weight: bold; color: #1160B7;">Q 9000.00</td>
                            <td th:text="${detalle.producto.nombre}">Laptop Dell</td>
                            <td th:text="${detalle.venta.id}">1</td>
                            <td class="actions-cell">
                                <a class="action-btn edit" th:href="@{/detalle-venta/editar/{id}(id=${detalle.id})}">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <a class="action-btn delete" th:href="@{/detalle-venta/eliminar/{id}(id=${detalle.id})}"
                                   onclick="return confirm('¿Deseas eliminar este registro de detalle?')">
                                    <i class="fas fa-trash-alt"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

</body>
</html>
