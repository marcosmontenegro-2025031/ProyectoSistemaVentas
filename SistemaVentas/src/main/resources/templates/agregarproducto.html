<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Producto</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/crud.css}">
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-store"></i> Sistema Ventas
        </div>
        <nav>
            <ul>
                <li><a th:href="@{/home}"><i class="fas fa-house"></i> Inicio</a></li>
                <li><a th:href="@{/ventas}"><i class="fas fa-cart-shopping"></i> Ventas</a></li>
                <li><a class="active" th:href="@{/productos}"><i class="fas fa-boxes-stacked"></i> Productos</a></li>
                <li><a th:href="@{/clientes}"><i class="fas fa-address-book"></i> Clientes</a></li>
                <li><a th:href="@{/usuarios}"><i class="fas fa-user-gear"></i> Usuarios</a></li>
                <li><a th:href="@{/detalleventa}"><i class="fas fa-circle-info"></i> Detalle Venta</a></li>
                <li><a th:href="@{/perfiladmin}"><i class="fas fa-user-gear"></i> Mi perfil</a></li>
                <li class="logout-item">
                    <a th:href="@{/login}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
                </li>
            </ul>
        </nav>
    </aside>

    <div class="main-wrapper">
        <header class="navbar">
            <div class="nav-left"><h2>Gestión de Productos</h2></div>
            <div class="nav-right">
                <a th:href="@{/perfiladmin}" class="nav-profile">
                    <img th:src="@{/images/admin.png}" class="nav-avatar-img">
                    <span class="nav-username">Admin</span>
                </a>
                <a th:href="@{/logout}" class="btn-logout-nav">
                    <i class="fas fa-sign-out-alt"></i> Salir
                </a>
            </div>
        </header>

        <main class="container">
            <div class="card-form" style="max-width: 450px; width: 100%;">
                <div class="card-header">
                    <i class="fas fa-plus-circle"></i>
                    <h2>Nuevo Producto</h2>
                </div>
                
                <form id="formProducto" th:action="@{/productos/guardarproducto}" th:object="${producto}" method="post" class="profile-form">
                    
                    <div class="form-group">
                        <label for="nombre">Nombre del Producto</label>
                        <div class="input-container">
                            <i class="fas fa-tag"></i>
                            <input type="text" th:field="*{nombre}" placeholder="Ej: Laptop Dell" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="precio">Precio (Q)</label>
                        <div class="input-container">
                            <i class="fas fa-money-bill-wave"></i>
                            <input type="number" th:field="*{precio}" step="0.01" placeholder="0.00" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="stock">Stock Inicial</label>
                        <div class="input-container">
                            <i class="fas fa-cubes"></i>
                            <input type="number" th:field="*{stock}" placeholder="0" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="estado">Disponibilidad</label>
                        <div class="input-container">
                            <i class="fas fa-info-circle"></i>
                            <select th:field="*{estado}" required>
                                <option value="1">Activo / En Stock</option>
                                <option value="0">Inactivo / Agotado</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-save">
                            <i class="fas fa-save"></i> Guardar Producto
                        </button>
                        <a th:href="@{/productos}" class="btn-cancel">Cancelar</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

</body>
</html>
