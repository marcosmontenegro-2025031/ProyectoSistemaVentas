<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/crud.css}">
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-store"></i> Sistema Ventas
        </div>
        <nav>
            <ul>
                <li><a th:href="@{/home}"><i class="fas fa-house"></i> Inicio</a></li>
                <li><a th:href="@{/ventas}"><i class="fas fa-cart-shopping"></i> Ventas</a></li>
                <li><a th:href="@{/productos}"><i class="fas fa-boxes-stacked"></i> Productos</a></li>
                <li><a th:href="@{/clientes}"><i class="fas fa-address-book"></i> Clientes</a></li>
                <li><a class="active" th:href="@{/usuarios}"><i class="fas fa-user-gear"></i> Usuarios</a></li>
                <li><a th:href="@{/detalleventa}"><i class="fas fa-circle-info"></i> Detalle Venta</a></li>
                <li class="logout-item">
                    <a th:href="@{/login}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
                </li>
            </ul>
        </nav>
    </aside>

    <div class="main-wrapper">
        <header class="navbar">
            <div class="nav-left">
                <h2>Gestión de Ventas</h2>
            </div>
            <div class="nav-right">
            <a th:href="@{/logout}" class="btn-logout-nav" style="text-decoration: none;">
                <i class="fas fa-sign-out-alt"></i> Salir
            </a>
        </div>
        </header>

        <main class="main-content" style="padding: 30px;">
            
            <div class="table-header-actions" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <h3 style="color: #333; margin: 0;">Usuarios del Sistema</h3>
                
                <div style="display: flex; gap: 15px; align-items: center;">
                    <div class="input-container" style="margin: 0;">
                        <i class="fas fa-search"></i>
                        <input type="text" id="buscar" placeholder="Buscar usuario..." onkeyup="filtrarTabla()" style="width: 100px;">
                    </div>

                    <a th:href="@{/usuarios/agregarusuario}" class="btn-add-sm">
                        <i class="fas fa-user-plus"></i> Nuevo Usuario
                    </a>
                </div>
            </div>

            <div class="table-container shadow-sm">
                <table class="table" id="tablaUsuarios">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${usuarios}">
                            <td th:text="${u.id}">1</td>
                            <td>
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <i class="fas fa-user-circle" style="color: #1160B7; font-size: 1.2rem;"></i>
                                    <span th:text="${u.username}" style="font-weight: 500;"></span>
                                </div>
                            </td>
                            <td th:text="${u.email}">usuario@example.com</td>
                            <td>
                                <span class="role-badge" 
                                      th:text="${u.rol == 1 ? 'Administrador' : 'Vendedor'}"
                                      th:style="${u.rol == 1 ? 'color: #e67e22; font-weight: bold;' : 'color: #34495e;'}">
                                    Vendedor
                                </span>
                            </td>
                            <td>
                                <span class="status-badge" 
                                      th:classappend="${u.estado == 1} ? 'active' : 'inactive'"
                                      th:text="${u.estado == 1 ? 'Activo' : 'Inactivo'}">
                                    Activo
                                </span>
                            </td>
                            <td class="text-center">
                                <div class="action-group">
                                    <a th:href="@{/usuarios/editarusuario/{id}(id=${u.id})}" class="action-btn edit" title="Editar">
                                        <i class="fas fa-user-edit"></i>
                                    </a>
                                    <a th:href="@{/usuarios/eliminar/{id}(id=${u.id})}" class="action-btn delete" 
                                       onclick="return confirm('¿Desea dar de baja a este usuario?')" title="Eliminar">
                                        <i class="fas fa-trash-alt"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
    function filtrarTabla() {
        let input = document.getElementById("buscar").value.toLowerCase();
        let filas = document.querySelectorAll("#tablaUsuarios tbody tr");

        filas.forEach(fila => {
            let texto = fila.innerText.toLowerCase();
            fila.style.display = texto.includes(input) ? "" : "none";
        });
    }
</script>

</body>
</html>
