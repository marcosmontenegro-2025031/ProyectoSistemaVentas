<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Venta</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/crud.css}">
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-store"></i> Sistema Ventas
        </div>
        <nav>
            <ul>
            <li><a th:href="@{/homevendedor}"><i class="fas fa-house"></i> Inicio</a></li>
            <li><a class="active" th:href="@{/ventasvendedor}"><i class="fas fa-cart-shopping"></i> Ventas</a></li>
            <li><a th:href="@{/productosvendedor}"><i class="fas fa-boxes-stacked"></i> Productos</a></li>
            <li><a th:href="@{/clientesvendedor}"><i class="fas fa-address-book"></i> Clientes</a></li>
            <li><a th:href="@{/detalleventavendedor}"><i class="fas fa-circle-info"></i> Detalle Venta</a></li>
            <li><a th:href="@{/perfil}"><i class="fas fa-user-gear"></i> Mi perfil</a></li>
            <li class="logout-item">
                <a th:href="@{/login}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
            </li>
        </ul>
        </nav>
    </aside>

    <div class="main-wrapper">
        
        <header class="navbar">
            <div class="nav-left">
                <h2>Gestión de Ventas</h2>
            </div>
            <div class="nav-right">
            <a th:href="@{/logout}" class="btn-logout-nav" style="text-decoration: none;">
                <i class="fas fa-sign-out-alt"></i> Salir
            </a>
        </div>
        </header>

        <main class="container">
            <div class="card-form" style="max-width: 450px; width: 100%;">
                <div class="card-header">
                    <i class="fas fa-cash-register"></i>
                    <h2>Registrar Venta</h2>
                </div>
                
                <form id="formVenta" th:action="@{/ventasvendedor/guardar}" method="post" class="profile-form">
                    
                    <div class="form-group">
                        <label for="fechaVenta">Fecha de Venta</label>
                        <div class="input-container">
                            <i class="fas fa-calendar-day"></i>
                            <input type="date" id="fechaVenta" name="fechaVenta" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="total">Total a Pagar (Q)</label>
                        <div class="input-container">
                            <i class="fas fa-money-check-dollar"></i>
                            <input type="number" id="total" name="total" step="0.01" placeholder="0.00" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="estado">Estado de la Transacción</label>
                        <div class="input-container">
                            <i class="fas fa-clipboard-check"></i>
                            <select id="estado" name="estado" required>
                                <option value="1">Completada</option>
                                <option value="0">Pendiente</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="cliente">DPI del Cliente</label>
                        <div class="input-container">
                            <i class="fas fa-id-card"></i>
                            <input type="text" id="cliente" name="cliente" placeholder="Número de DPI" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="usuario">ID del Vendedor</label>
                        <div class="input-container">
                            <i class="fas fa-user-tie"></i>
                            <input type="number" id="usuario" name="usuario" placeholder="ID de Usuario" required>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-save">
                            <i class="fas fa-save"></i> Guardar Registro
                        </button>
                        <a th:href="@{/ventasvendedor}" class="btn-cancel">Cancelar</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

</body>
</html>
