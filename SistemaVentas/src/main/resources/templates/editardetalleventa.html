<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Detalle</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/crud.css}">
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-store"></i> Sistema Ventas
        </div>
        <nav>
            <ul>
                <li><a th:href="@{/home}"><i class="fas fa-house"></i> Inicio</a></li>
                <li><a th:href="@{/ventas}"><i class="fas fa-cart-shopping"></i> Ventas</a></li>
                <li><a th:href="@{/productos}"><i class="fas fa-boxes-stacked"></i> Productos</a></li>
                <li><a th:href="@{/clientes}"><i class="fas fa-address-book"></i> Clientes</a></li>
                <li><a th:href="@{/usuarios}"><i class="fas fa-user-gear"></i> Usuarios</a></li>
                <li><a class="active" th:href="@{/detalleventa}"><i class="fas fa-circle-info"></i> Detalle Venta</a></li>
                <li class="logout-item">
                    <a th:href="@{/login}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
                </li>
            </ul>
        </nav>
    </aside>

    <div class="main-wrapper">
        
        <header class="navbar">
            <div class="nav-left">
                <h2>Gestión de Detalles</h2>
            </div>
            <div class="nav-right">
            <a th:href="@{/logout}" class="btn-logout-nav" style="text-decoration: none;">
                <i class="fas fa-sign-out-alt"></i> Salir
            </a>
        </div>
        </header>

        <main class="container">
            <div class="card-form" style="max-width: 450px; width: 100%;">
                <div class="card-header">
                    <i class="fas fa-edit"></i>
                    <h2>Modificar Detalle</h2>
                </div>
                
                <form th:action="@{/detalleventa/guardardetalle}" th:object="${detalleVenta}" method="post" class="profile-form">
                    
                    <div class="form-group">
                        <label for="id">Código de Detalle</label>
                        <div class="input-container">
                            <i class="fas fa-hashtag"></i>
                            <input type="text" th:field="*{id}" class="readonly-input" readonly>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="cantidad">Cantidad</label>
                        <div class="input-container">
                            <i class="fas fa-sort-numeric-up-alt"></i>
                            <input type="number" th:field="*{cantidad}" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="precioUnitario">Precio Unitario (Q)</label>
                        <div class="input-container">
                            <i class="fas fa-tag"></i>
                            <input type="number" th:field="*{precioUnitario}" step="0.01" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="subtotal">SubTotal (Q)</label>
                        <div class="input-container">
                            <i class="fas fa-calculator"></i>
                            <input type="number" th:field="*{subtotal}" step="0.01" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="producto">Producto</label>
                        <div class="input-container">
                            <i class="fas fa-box"></i>
                            <select th:field="*{producto}" required>
                                <option th:each="p : ${productos}" th:value="${p.id}" th:text="${p.nombre}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="venta">ID de Venta Relacionada</label>
                        <div class="input-container">
                            <i class="fas fa-receipt"></i>
                            <select th:field="*{venta}" required>
                                <option th:each="v : ${ventas}" th:value="${v.id}" th:text="'Venta #' + ${v.id}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-save">
                            <i class="fas fa-sync-alt"></i> Actualizar Detalle
                        </button>
                        <a th:href="@{/detalleventa}" class="btn-cancel">Cancelar</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

</body>
</html>
