<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Usuario</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../static/crud.css">
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-header"><i class="fas fa-store"></i> Agregar Usuario</div>
    <nav>
        <ul>
            <li><a href='../templates/home.html'><i class="fas fa-house"></i> Inicio</a></li>
            <li><a href='../templates/ventas.html'><i class="fas fa-cart-shopping"></i> Ventas</a></li>
            <li><a href='../templates/productos.html'><i class="fas fa-boxes-stacked"></i> Productos</a></li>
            <li><a class="active" href='../templates/usuarios.html'><i class="fas fa-user-gear"></i> Usuarios</a></li>
            <li><a href="../templates/detalleventa.html"><i class="fas fa-circle-info"></i>Detalle Venta</a></li>
            <li><a href='../templates/login.html'><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
        </ul>
    </nav>
</aside>

<div class="main-wrapper">
    <header class="navbar">
        <h2>Agregar Usuario</h2>
        <button class="btn-logout-nav"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</button>
    </header>

    <main class="container">
        <div class="card" style="width: 450px;">
            <h2>Nuevo Usuario</h2>
            <form id="formUsuario" class="profile-form">
                <div class="form-group" style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">Username</label>
                    <input type="text" id="username" name="username" placeholder="Ej: luisromero" 
                           style="border-radius: 25px; text-align: center;" required>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">Password</label>
                    <input type="text" id="password" name="password" placeholder="Ej: 12345" 
                           style="border-radius: 25px; text-align: center;" required>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">Rol</label>
                    <select id="rol" name="rol" style="border-radius: 25px; text-align-last: center;" required>
                        <option value="1">Administrador</option>
                        <option value="0">Usuario</option>
                    </select>
                </div>

                <div class="form-group" style="margin-bottom: 25px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">Estado</label>
                    <select id="estado" name="estado" style="border-radius: 25px; text-align-last: center;" required>
                        <option value="1">Activo</option>
                        <option value="0">Inactivo</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-action" style="border-radius: 25px;">
                        <i class="fas fa-save"></i> Guardar Usuario
                    </button>
                </div>
            </form>
        </div>
    </main>
</div>

</body>
</html>
