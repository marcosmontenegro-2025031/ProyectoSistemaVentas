<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Usuario | Sistema de Ventas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/crud.css}">
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-store"></i> Sistema Ventas
        </div>
        <nav>
            <ul>
                <li><a th:href="@{/home}"><i class="fas fa-house"></i> Inicio</a></li>
                <li><a th:href="@{/ventas}"><i class="fas fa-cart-shopping"></i> Ventas</a></li>
                <li><a th:href="@{/productos}"><i class="fas fa-boxes-stacked"></i> Productos</a></li>
                <li><a th:href="@{/clientes}"><i class="fas fa-address-book"></i> Clientes</a></li>
                <li><a class="active" th:href="@{/usuarios}"><i class="fas fa-user-gear"></i> Usuarios</a></li>
                <li><a th:href="@{/detalle-venta}"><i class="fas fa-circle-info"></i> Detalle Venta</a></li>
                <li class="logout-item">
                    <a th:href="@{/login}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
                </li>
            </ul>
        </nav>
    </aside>

    <div class="main-wrapper">
        
        <header class="navbar">
            <div class="nav-left">
                <h2>Control de Acceso</h2>
            </div>
            <div class="nav-right">
                <button class="btn-logout-nav">
                    <i class="fas fa-sign-out-alt"></i> Salir
                </button>
            </div>
        </header>

        <main class="container">
            <div class="card-form" style="max-width: 450px; width: 100%;">
                <div class="card-header">
                    <i class="fas fa-user-shield"></i>
                    <h2>Crear Nuevo Usuario</h2>
                </div>
                
                <form id="formUsuario" th:action="@{/usuarios/guardar}" method="post" class="profile-form">
                    
                    <div class="form-group">
                        <label for="username">Nombre de Usuario</label>
                        <div class="input-container">
                            <i class="fas fa-user-at"></i>
                            <input type="text" id="username" name="username" placeholder="Ej: luisromero" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="input-container">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="rol">Rol de Usuario</label>
                        <div class="input-container">
                            <i class="fas fa-user-tag"></i>
                            <select id="rol" name="rol" required>
                                <option value="" disabled selected>Seleccione un rol</option>
                                <option value="ADMIN">Administrador</option>
                                <option value="USER">Usuario Estándar</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="estado">Estado de Cuenta</label>
                        <div class="input-container">
                            <i class="fas fa-check-circle"></i>
                            <select id="estado" name="estado" required>
                                <option value="1">Activo</option>
                                <option value="0">Inactivo / Suspendido</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-save">
                            <i class="fas fa-user-plus"></i> Guardar Usuario
                        </button>
                        <a th:href="@{/usuarios}" class="btn-cancel">Cancelar</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

</body>
</html>
