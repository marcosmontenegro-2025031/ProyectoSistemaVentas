<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inicio</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f1f5f9;
        }

        .navbar {
            background: #2563eb;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
        }

        .container {
            padding: 30px;
            text-align: center;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 20px auto;
            width: 300px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        button {
            padding: 10px 20px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>

<div class="navbar">
    Sistema de Ventas
</div>

<div class="container">
    
    <div class="card">
        <h2>Bienvenido</h2>
        <p>Has iniciado sesión correctamente</p>

        <form action="/login" method="get">
            <button type="submit">Cerrar sesión</button>
        </form>
    </div>

</div>

</body>
</html>
