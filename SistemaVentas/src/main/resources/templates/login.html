<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<div class="box">
        <h1 style="text-align: center; font-family: 'Segoe UI', Arial, sans-serif;">Login</h1>

    <form th:action="@{/login}" method="post">

    <input type="text" name="username" required placeholder="Ingrese su usuario">
    <input type="password" name="password" required placeholder="Ingrese su contraseña">
    <button type="submit">Entrar</button>
 </form>   
    

        <p style="text-align: center; font-family: 'Segoe UI', Arial, sans-serif;">Aún no tienes cuenta?</p>
        <a th:href="@{/registro}" style="text-align: center; font-family: 'Segoe UI', Arial, sans-serif; display: block;">Crea tu cuenta aquí</a>

    

</div>

</body>
</html>
