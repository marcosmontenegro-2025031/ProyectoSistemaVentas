<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Venta</title>
    <link rel="stylesheet" th:href="@{/css/crud.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-store"></i> Sistema Ventas
        </div>
        <nav>
            <ul>
                <li><a th:href="@{/home}"><i class="fas fa-house"></i> Inicio</a></li>
                <li><a class="active" th:href="@{/ventas}"><i class="fas fa-cart-shopping"></i> Ventas</a></li>
                <li><a th:href="@{/productos}"><i class="fas fa-boxes-stacked"></i> Productos</a></li>
                <li><a th:href="@{/clientes}"><i class="fas fa-address-book"></i> Clientes</a></li>
                <li><a th:href="@{/usuarios}"><i class="fas fa-user-gear"></i> Usuarios</a></li>
                <li><a th:href="@{/detalleventa}"><i class="fas fa-circle-info"></i> Detalle Venta</a></li>
                <li><a th:href="@{/perfiladmin}"><i class="fas fa-user-gear"></i> Mi perfil</a></li>
                <li class="logout-item">
                    <a th:href="@{/login}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
                </li>
            </ul>
        </nav>
    </aside>

    <div class="main-wrapper">
        <div class="main-wrapper">
        <header class="navbar">
            <div class="nav-left"><h2>Gestión de Ventas</h2></div>
            <div class="nav-right">
                <a th:href="@{/perfiladmin}" class="nav-profile">
                    <img th:src="@{/images/admin.png}" class="nav-avatar-img">
                    <span class="nav-username">Admin</span>
                </a>
                <a th:href="@{/logout}" class="btn-logout-nav">
                    <i class="fas fa-sign-out-alt"></i> Salir
                </a>
            </div>
        </header>

        <main class="container">
            <div class="card-form" style="max-width: 450px; width: 100%;">
                <div class="card-header">
                    <i class="fas fa-file-invoice-dollar"></i>
                    <h2>Modificar Transacción</h2>
                </div>
                
                <form id="formVenta" th:action="@{/ventas/guardarventa}" th:object="${venta}" method="post" class="profile-form">
                    
                    <input type="hidden" th:field="*{id}">

                    <div class="form-group">
                        <label for="fechaVenta">Fecha de Venta</label>
                        <div class="input-container">
                            <i class="fas fa-calendar-alt"></i>
                            <input type="date" th:field="*{fechaVenta}" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="total">Total a Pagar (Q)</label>
                        <div class="input-container">
                            <i class="fas fa-money-bill-wave"></i>
                            <input type="number" th:field="*{total}" step="0.01" placeholder="0.00" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="estado">Estado de la Transacción</label>
                        <div class="input-container">
                            <i class="fas fa-info-circle"></i>
                            <select th:field="*{estado}" required>
                                <option value="1">Completada</option>
                                <option value="0">Pendiente / Cancelada</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="cliente">Cliente</label>
                        <div class="input-container">
                            <i class="fas fa-id-card"></i>
                            <select th:field="*{cliente}" required>
                                <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombre + ' ' + c.apellido}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="usuario">Vendedor Responsable</label>
                        <div class="input-container">
                            <i class="fas fa-user-tie"></i>
                            <select th:field="*{usuario}" required>
                                <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.username}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-save">
                            <i class="fas fa-save"></i> Guardar Cambios
                        </button>
                        <a th:href="@{/ventas}" class="btn-cancel">Cancelar</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

</body>
</html>
