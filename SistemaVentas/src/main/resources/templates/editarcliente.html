<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Producto</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../static/crud.css">
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-header">
        <i class="fas fa-store"></i> Modificar Cliente
    </div>
    <nav>
        <ul>
            <li><a href='../templates/home.html'><i class="fas fa-house"></i> Inicio</a></li>
            <li><a href='../templates/ventas.html'><i class="fas fa-cart-shopping"></i> Ventas</a></li>
            <li><a href='../templates/productos.html'><i class="fas fa-boxes-stacked"></i> Productos</a></li>
            <li><a class="active" href='../templates/clientes.html'><i class="fas fa-address-book"></i> Clientes</a></li>
            <li><a href='../templates/usuarios.html'><i class="fas fa-user-gear"></i> Usuarios</a></li>
            <li><a href="../templates/detalleventa.html"><i class="fas fa-circle-info"></i>Detalle Venta</a></li>
            <li><a href='../templates/login.html'><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
        </ul>
    </nav>
</aside>

<div class="main-wrapper">
    <header class="navbar">
        <h2>Editar Cliente</h2>
        <button class="btn-logout-nav"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</button>
    </header>

    <main class="container">
        <div class="card" style="width: 450px;">
            <h2>Modificar Cliente</h2>
            <form id="formEditCliente" class="profile-form">
                
                <div class="form-group" style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">Código (ID)</label>
                    <input type="text" id="id" name="id" value="1" 
                           style="border-radius: 25px; text-align: center; background: #f4f7f9;" readonly>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">Nombre del Cliente</label>
                    <input type="text" id="nombre" name="nombre" value="Luis Matias" 
                           style="border-radius: 25px; text-align: center;" required>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">Apellido del Cliente</label>
                    <input type="text" id="apellido" name="apellido" value="Romero" 
                           style="border-radius: 25px; text-align: center;" required>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">Dirección</label>
                    <input type="text" id="direccion" name="direccion" value="14 calle zona 18" 
                           style="border-radius: 25px; text-align: center;" required>
                </div>

                <div class="form-group" style="margin-bottom: 25px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">Estado</label>
                    <select id="estado" name="estado" style="border-radius: 25px; text-align-last: center;" required>
                        <option value="1" selected>Activo / En Stock</option>
                        <option value="0">Inactivo / Agotado</option>
                    </select>
                </div>

                <div class="form-actions" style="display: flex; gap: 10px;">
                    <button type="submit" class="btn-action" style="border-radius: 25px;">
                        <i class="fas fa-save"></i> Actualizar
                    </button>
                    <a href="../templates/clientes.html" class="btn-action" 
                       style="border-radius: 25px; background: #DFE2E8; color: #242424; text-decoration: none; display: flex; align-items: center; justify-content: center;">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </main>
</div>

</body>
</html>
