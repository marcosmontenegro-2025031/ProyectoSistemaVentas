<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil del Usuario</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/perfil.css}">
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-store"></i> Sistema Ventas
        </div>
        <nav>
            <ul>
                <li><a th:href="@{/homevendedor}"><i class="fas fa-house"></i> Inicio</a></li>
                <li><a th:href="@{/ventasvendedor}"><i class="fas fa-cart-shopping"></i> Ventas</a></li>
                <li><a th:href="@{/productosvendedor}"><i class="fas fa-boxes-stacked"></i> Productos</a></li>
                <li><a th:href="@{/clientesvendedor}"><i class="fas fa-address-book"></i> Clientes</a></li>
                <li><a th:href="@{/detalleventavendedor}"><i class="fas fa-circle-info"></i> Detalle Venta</a></li>
                <li><a class="active" th:href="@{/perfil}"><i class="fas fa-user-gear"></i> Mi perfil</a></li>
                <li class="logout-item">
                    <a th:href="@{/login}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
                </li>
            </ul>
    </aside>

    <div class="main-wrapper">
        <header class="navbar">
            <div class="nav-left"><h2>Gestión de Perfil</h2></div>
            <div class="nav-right">
                <a th:href="@{/logout}" class="btn-logout-nav"><i class="fas fa-sign-out-alt"></i> Salir</a>
            </div>
        </header>

        <main class="container">
            <div class="card-form">
                <div class="card-header">
                    <i class="fas fa-user-pen"></i>
                    <h2>Mis Datos</h2>
                </div>
                
                <form th:action="@{/usuariosvendedor/guardar}" th:object="${usuario}" method="post" class="profile-form">
                    <div class="form-group">
                        <label>Código (ID)</label>
                        <div class="input-container">
                            <i class="fas fa-fingerprint"></i>
                            <input type="text" th:field="*{id}" class="readonly-input" readonly>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Nombre de Usuario</label>
                        <div class="input-container">
                            <i class="fas fa-user-tag"></i>
                            <input type="text" th:field="*{username}" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <div class="input-container">
                            <i class="fas fa-envelope"></i>
                            <input type="email" th:field="*{email}" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Contraseña</label>
                        <div class="input-container">
                            <i class="fas fa-key"></i>
                            <input type="password" th:field="*{password}" placeholder="Nueva contraseña">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Rol</label>
                        <div class="input-container">
                            <i class="fas fa-shield-halved"></i>
                            <select th:field="*{rol}">
                                <option value="ADMIN">Administrador</option>
                                <option value="VENDEDOR">Vendedor</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-save"><i class="fas fa-save"></i> Guardar</button>
                        <a th:href="@{/homevendedor}" class="btn-cancel">Cancelar</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
    
</body>
</html>
