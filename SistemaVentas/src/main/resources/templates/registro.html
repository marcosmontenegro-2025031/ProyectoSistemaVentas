<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro | Sistema Ventas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/registro.css}">
</head>
<body>
    <div class="card-form" style="max-width: 400px; width: 100%;">
        <div class="card-header">
            <i class="fas fa-user-plus"></i>
            <h2>Crear Cuenta</h2>
        </div>

        <form th:action="@{/registro}" method="post" class="profile-form">
            
            <div th:if="${error}" style="color: #D24726; background: #FFEBEE; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; text-align: center;">
                <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
            </div>

            <div class="form-group">
                <label>Nombre de Usuario</label>
                <div class="input-container">
                    <i class="fas fa-user"></i>
                    <input type="text" name="username" placeholder="Usuario" required>
                </div>
            </div>

            <div class="form-group">
                <label>Correo Electrónico</label>
                <div class="input-container">
                    <i class="fas fa-envelope"></i>
                    <input type="email" name="email" placeholder="ejemplo@correo.com" required>
                </div>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <div class="input-container">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-save" style="width: 100%;">
                    Registrarse
                </button>
                <a th:href="@{/login}" class="btn-cancel" style="display: block; margin-top: 15px; text-align: center;">
                    ¿Ya tienes cuenta? Inicia sesión
                </a>
            </div>
        </form>
    </div>
</body>
</html>
